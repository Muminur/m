[package]
name = "whisper-desk-app"
version = "1.0.1"
description = "WhisperDesk - Local-first transcription app"
authors = []
edition = "2021"
rust-version = "1.77"

[lib]
name = "whisper_desk_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "whisper-desk-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["protocol-asset", "tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-updater = "2.2"
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-clipboard-manager = "2.2"
tauri-plugin-process = "2.2"
tauri-plugin-deep-link = "2.2"

# Database
rusqlite = { version = "0.32", features = ["bundled-full"] }
refinery = { version = "0.8", features = ["rusqlite"] }

# Async / networking
tokio = { version = "1.42", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"], default-features = false }
url = "2.5"
futures-lite = "2.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system
notify = "7.0"
tempfile = "3.14"
zip = "2.2"

# Export
printpdf = "0.7"
handlebars = "6.2"
base64 = "0.22"

# Utility
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
dirs = "5.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = "2.1"

# Audio decode
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "ogg", "pcm", "isomp4"] }

# Audio capture (microphone + system)
cpal = "0.15"
hound = "3.5"

# Resampling
rubato = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.0"
core-foundation = "0.10"
# Whisper inference (requires Metal + libclang — macOS only)
whisper-rs = { version = "0.16.0", features = ["metal"] }
# Offline neural machine translation (CTranslate2). CPU int8 on Intel Mac.
# NOTE: ct2rs-platform hardcodes the `mkl` feature for macOS x86_64, but its
# `intel-onemkl-prebuild` dep panics "MacOS is not supported" (no macOS binaries).
# So we depend on ct2rs directly with default-features off and select macOS-safe
# CPU backends: `dnnl` (oneDNN, built from source) + `ruy` (lightweight int8).
# NEVER enable Metal/GPU/cuda here — Intel x86_64 aborts on Metal.
ct2rs = { version = "0.9", default-features = false, features = ["dnnl", "ruy", "tokenizers"] }
# Floating recorder NSPanel support (macOS-only; pulls in cocoa/objc).
# git-only crate; v2 branch targets tauri ^2.0.6 (unifies with tauri 2.10.3).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[[bench]]
name = "transcription_bench"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
